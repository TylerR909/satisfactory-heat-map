[package]
name = "konsl_randomization"
version = "0.1.0"
edition.workspace = true
license = "MIT"
publish.workspace = true
description = "Konsl satisfactory-world-generator randomization (MIT) + JSON node adapter"

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
tsify = { version = "0.5.5", features = ["js"] }
wasm-bindgen = "0.2"
