"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

# Surface env files + generated basemap tiles in the workspace file picker.
# (Tiles stay gitignored; setup regenerates them per worktree.)
file_include_globs = ".env*\n**/*.webp"

# Preview URLs from the Conductor Open menu.
# npm start binds a stable Vite default (5173) so browser localStorage survives
# restarts. CONDUCTOR_PORT is ignored unless USE_CONDUCTOR_PORT=1 (see scripts/dev-start.mjs).
[[preview_urls]]
name = "localhost"
url = "http://localhost:5173/"

# Docker Compose host port (default 18547). For a second worktree, set
# HEATMAP_PORT and update this URL or open the port manually.
[[preview_urls]]
name = "docker"
url = "http://localhost:18547/"

[scripts]
# Per-worktree: install deps, basemap tiles, and prebuild WASM (Docker if no wasm-pack).
# Avoids first `npm start` paying a multi-minute rustc cold compile.
setup = "npm ci && npm run map:ensure && npm run wasm:build"
# Drop gitignored tiles + WASM build artifacts when archiving the worktree
archive = "npm run map:clean && npm run clean"
# Stable Vite port (5173); not CONDUCTOR_PORT — preserves localStorage origin
run = "npm start"
auto_run_after_setup = false
