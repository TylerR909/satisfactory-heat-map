# PR / main validation: lint, unit tests, production build.
# Keeps the branch mergeable without deploying.

name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # map:ensure unpacks map-tiles/v1.tar.gz so dist includes real WebPs (same as CF Git).
      - name: Build
        run: npm run build

  # Smoke the multi-stage Dockerfile (generates basemap tiles + nginx dist)
  docker:
    name: Docker build (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: check

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: satisfactory-heat-map:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Assert basemap tile in image
        run: |
          docker create --name sf-ci-map satisfactory-heat-map:ci
          docker cp sf-ci-map:/usr/share/nginx/html/map/v1/0/0/0.webp /tmp/map-0-0-0.webp
          docker rm sf-ci-map
          test -s /tmp/map-0-0-0.webp
          echo "Basemap tile OK ($(wc -c </tmp/map-0-0-0.webp) bytes)"
